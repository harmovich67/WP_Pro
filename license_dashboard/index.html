<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Harmulizer Pro - License Dashboard</title>
    <style>
      :root {
        --bg-primary: #0f0f23;
        --bg-secondary: #1a1a2e;
        --bg-card: #16213e;
        --accent: #4f46e5;
        --accent-hover: #4338ca;
        --success: #10b981;
        --warning: #f59e0b;
        --danger: #ef4444;
        --text-primary: #e5e7eb;
        --text-secondary: #9ca3af;
        --border: #374151;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "Segoe UI", Tahoma, sans-serif;
        background: var(--bg-primary);
        color: var(--text-primary);
        min-height: 100vh;
      }

      /* Header */
      .header {
        background: linear-gradient(
          135deg,
          var(--bg-secondary),
          var(--bg-card)
        );
        padding: 20px 40px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-bottom: 1px solid var(--border);
      }

      .logo {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .logo h1 {
        font-size: 24px;
        background: linear-gradient(135deg, var(--accent), #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }

      .logo span {
        font-size: 12px;
        background: var(--accent);
        color: white;
        padding: 4px 8px;
        border-radius: 4px;
      }

      /* Main Content */
      .container {
        max-width: 1400px;
        margin: 0 auto;
        padding: 30px;
      }

      /* Stats Grid */
      .stats-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
        gap: 20px;
        margin-bottom: 30px;
      }

      .stat-card {
        background: var(--bg-card);
        border-radius: 16px;
        padding: 24px;
        border: 1px solid var(--border);
        transition:
          transform 0.2s,
          box-shadow 0.2s;
      }

      .stat-card:hover {
        transform: translateY(-4px);
        box-shadow: 0 10px 30px rgba(79, 70, 229, 0.2);
      }

      .stat-card h3 {
        color: var(--text-secondary);
        font-size: 14px;
        margin-bottom: 8px;
      }

      .stat-card .value {
        font-size: 36px;
        font-weight: 700;
        background: linear-gradient(135deg, var(--accent), #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }

      .stat-card.success .value {
        background: linear-gradient(135deg, var(--success), #059669);
        -webkit-background-clip: text;
      }

      .stat-card.warning .value {
        background: linear-gradient(135deg, var(--warning), #d97706);
        -webkit-background-clip: text;
      }

      /* Section Card */
      .section-card {
        background: var(--bg-card);
        border-radius: 16px;
        padding: 24px;
        border: 1px solid var(--border);
        margin-bottom: 24px;
      }

      .section-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 20px;
      }

      .section-header h2 {
        font-size: 20px;
        display: flex;
        align-items: center;
        gap: 10px;
      }

      /* Buttons */
      .btn {
        padding: 10px 20px;
        border: none;
        border-radius: 8px;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.2s;
        display: inline-flex;
        align-items: center;
        gap: 8px;
      }

      .btn-primary {
        background: linear-gradient(135deg, var(--accent), #7c3aed);
        color: white;
      }

      .btn-primary:hover {
        background: linear-gradient(135deg, var(--accent-hover), #6d28d9);
        transform: translateY(-2px);
      }

      .btn-success {
        background: var(--success);
        color: white;
      }

      .btn-danger {
        background: var(--danger);
        color: white;
      }

      .btn-outline {
        background: transparent;
        border: 1px solid var(--border);
        color: var(--text-primary);
      }

      .btn-outline:hover {
        background: var(--bg-secondary);
      }

      /* Table */
      .table-container {
        overflow-x: auto;
      }

      table {
        width: 100%;
        border-collapse: collapse;
      }

      th,
      td {
        padding: 16px;
        text-align: right;
        border-bottom: 1px solid var(--border);
      }

      th {
        color: var(--text-secondary);
        font-weight: 600;
        font-size: 13px;
        text-transform: uppercase;
      }

      tr:hover {
        background: rgba(79, 70, 229, 0.1);
      }

      /* Badges */
      .badge {
        padding: 4px 12px;
        border-radius: 20px;
        font-size: 12px;
        font-weight: 600;
      }

      .badge-free {
        background: #374151;
        color: #9ca3af;
      }
      .badge-basic {
        background: rgba(59, 130, 246, 0.2);
        color: #3b82f6;
      }
      .badge-pro {
        background: rgba(245, 158, 11, 0.2);
        color: #f59e0b;
      }
      .badge-enterprise {
        background: rgba(16, 185, 129, 0.2);
        color: #10b981;
      }
      .badge-active {
        background: rgba(16, 185, 129, 0.2);
        color: #10b981;
      }
      .badge-inactive {
        background: rgba(239, 68, 68, 0.2);
        color: #ef4444;
      }

      /* Modal */
      .modal {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.7);
        z-index: 1000;
        align-items: center;
        justify-content: center;
      }

      .modal.active {
        display: flex;
      }

      .modal-content {
        background: var(--bg-card);
        border-radius: 16px;
        padding: 32px;
        width: 90%;
        max-width: 500px;
        border: 1px solid var(--border);
      }

      .modal-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 24px;
      }

      .modal-header h3 {
        font-size: 20px;
      }

      .close-btn {
        background: none;
        border: none;
        color: var(--text-secondary);
        font-size: 24px;
        cursor: pointer;
      }

      /* Forms */
      .form-group {
        margin-bottom: 20px;
      }

      .form-group label {
        display: block;
        margin-bottom: 8px;
        color: var(--text-secondary);
        font-size: 14px;
      }

      .form-group input,
      .form-group select {
        width: 100%;
        padding: 12px 16px;
        background: var(--bg-secondary);
        border: 1px solid var(--border);
        border-radius: 8px;
        color: var(--text-primary);
        font-size: 14px;
      }

      .form-group input:focus,
      .form-group select:focus {
        outline: none;
        border-color: var(--accent);
      }

      /* Login */
      .login-container {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 20px;
      }

      .login-card {
        background: var(--bg-card);
        border-radius: 16px;
        padding: 40px;
        width: 100%;
        max-width: 400px;
        border: 1px solid var(--border);
        text-align: center;
      }

      .login-card h2 {
        margin-bottom: 8px;
      }

      .login-card p {
        color: var(--text-secondary);
        margin-bottom: 24px;
      }

      /* Actions */
      .actions {
        display: flex;
        gap: 8px;
      }

      .action-btn {
        padding: 6px 12px;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        font-size: 12px;
        transition: opacity 0.2s;
      }

      .action-btn:hover {
        opacity: 0.8;
      }

      .action-btn.edit {
        background: rgba(59, 130, 246, 0.2);
        color: #3b82f6;
      }

      .action-btn.delete {
        background: rgba(239, 68, 68, 0.2);
        color: #ef4444;
      }

      /* WhatsApp button */
      .whatsapp-btn {
        background: #25d366;
        color: white;
      }

      /* Copy button */
      .copy-btn {
        background: transparent;
        border: none;
        color: var(--accent);
        cursor: pointer;
        padding: 4px 8px;
        border-radius: 4px;
      }

      .copy-btn:hover {
        background: rgba(79, 70, 229, 0.2);
      }

      /* Loading */
      .loading {
        text-align: center;
        padding: 40px;
        color: var(--text-secondary);
      }

      /* Toast */
      .toast {
        position: fixed;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        background: var(--bg-card);
        color: var(--text-primary);
        padding: 16px 24px;
        border-radius: 8px;
        border: 1px solid var(--border);
        display: none;
        z-index: 2000;
      }

      .toast.success {
        border-color: var(--success);
      }

      .toast.error {
        border-color: var(--danger);
      }

      .toast.show {
        display: block;
        animation: slideUp 0.3s ease;
      }

      @keyframes slideUp {
        from {
          opacity: 0;
          transform: translateX(-50%) translateY(20px);
        }
        to {
          opacity: 1;
          transform: translateX(-50%) translateY(0);
        }
      }
    </style>
  </head>
  <body>
    <!-- Login Page -->
    <div id="loginPage" class="login-container">
      <div class="login-card">
        <h2>🔐 تسجيل الدخول</h2>
        <p>داشبورد إدارة تراخيص Harmulizer Pro</p>
        <div class="form-group">
          <label>كلمة المرور</label>
          <input
            type="password"
            id="adminToken"
            placeholder="أدخل رمز الأمان"
          />
        </div>
        <button class="btn btn-primary" style="width: 100%" onclick="login()">
          دخول
        </button>
      </div>
    </div>

    <!-- Dashboard (hidden initially) -->
    <div id="dashboard" style="display: none">
      <header class="header">
        <div class="logo">
          <h1>🎛️ Harmulizer Pro</h1>
          <span>License Dashboard</span>
        </div>
        <button class="btn btn-outline" onclick="logout()">تسجيل الخروج</button>
      </header>

      <div class="container">
        <!-- Stats -->
        <div class="stats-grid">
          <div class="stat-card">
            <h3>📊 إجمالي التراخيص</h3>
            <div class="value" id="totalLicenses">0</div>
          </div>
          <div class="stat-card success">
            <h3>✅ تراخيص نشطة</h3>
            <div class="value" id="activeLicenses">0</div>
          </div>
          <div class="stat-card warning">
            <h3>⏰ منتهية الصلاحية</h3>
            <div class="value" id="expiredLicenses">0</div>
          </div>
          <div class="stat-card">
            <h3>🏢 Enterprise</h3>
            <div class="value" id="enterpriseLicenses">0</div>
          </div>
        </div>

        <!-- Licenses Table -->
        <div class="section-card">
          <div class="section-header">
            <h2>📋 التراخيص</h2>
            <button class="btn btn-primary" onclick="openCreateModal()">
              ➕ إنشاء ترخيص جديد
            </button>
          </div>
          <div class="table-container">
            <table>
              <thead>
                <tr>
                  <th>المفتاح</th>
                  <th>المستوى</th>
                  <th>العميل</th>
                  <th>الحالة</th>
                  <th>التفعيلات</th>
                  <th>تاريخ الإنشاء</th>
                  <th>تاريخ الانتهاء</th>
                  <th>الإجراءات</th>
                </tr>
              </thead>
              <tbody id="licensesTable">
                <tr>
                  <td colspan="8" class="loading">جاري التحميل...</td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>

    <!-- Create License Modal -->
    <div id="createModal" class="modal">
      <div class="modal-content">
        <div class="modal-header">
          <h3>➕ إنشاء ترخيص جديد</h3>
          <button class="close-btn" onclick="closeModal('createModal')">
            &times;
          </button>
        </div>
        <form onsubmit="createLicense(event)">
          <div class="form-group">
            <label>المستوى</label>
            <select id="newTier">
              <option value="basic">💼 أساسي - $50/شهر</option>
              <option value="pro" selected>⭐ احترافي - $200/شهر</option>
              <option value="enterprise">🏢 مؤسسي - $400/شهر</option>
            </select>
          </div>
          <div class="form-group">
            <label>اسم العميل</label>
            <input type="text" id="newCustomerName" placeholder="اسم العميل" />
          </div>
          <div class="form-group">
            <label>البريد الإلكتروني</label>
            <input type="email" id="newEmail" placeholder="email@example.com" />
          </div>
          <div class="form-group">
            <label>رقم الواتساب</label>
            <input type="text" id="newWhatsapp" placeholder="+966XXXXXXXXX" />
          </div>
          <div class="form-group">
            <label>مدة الصلاحية (بالأيام)</label>
            <input type="number" id="newDays" value="30" min="1" />
          </div>
          <div class="form-group">
            <label>عدد التفعيلات المسموح</label>
            <input type="number" id="newMaxActivations" value="1" min="1" />
          </div>
          <div class="form-group">
            <label>ملاحظات</label>
            <input type="text" id="newNotes" placeholder="ملاحظات إضافية" />
          </div>
          <button type="submit" class="btn btn-primary" style="width: 100%">
            إنشاء الترخيص
          </button>
        </form>
      </div>
    </div>

    <!-- Toast -->
    <div id="toast" class="toast"></div>

    <script>
      const API_URL = "http://localhost:8000";
      let authToken = "";

      // Login
      function login() {
        const token = document.getElementById("adminToken").value;
        if (!token) {
          showToast("الرجاء إدخال رمز الأمان", "error");
          return;
        }

        authToken = token;
        localStorage.setItem("adminToken", token);

        // Test token by fetching stats
        fetch(`${API_URL}/api/stats`, {
          headers: { Authorization: `Bearer ${token}` },
        })
          .then((res) => {
            if (!res.ok) throw new Error("Unauthorized");
            return res.json();
          })
          .then(() => {
            document.getElementById("loginPage").style.display = "none";
            document.getElementById("dashboard").style.display = "block";
            loadData();
          })
          .catch(() => {
            showToast("رمز الأمان غير صحيح", "error");
            localStorage.removeItem("adminToken");
          });
      }

      function logout() {
        authToken = "";
        localStorage.removeItem("adminToken");
        document.getElementById("loginPage").style.display = "flex";
        document.getElementById("dashboard").style.display = "none";
      }

      // Load data
      function loadData() {
        loadStats();
        loadLicenses();
      }

      function loadStats() {
        fetch(`${API_URL}/api/stats`, {
          headers: { Authorization: `Bearer ${authToken}` },
        })
          .then((res) => res.json())
          .then((data) => {
            document.getElementById("totalLicenses").textContent =
              data.total_licenses;
            document.getElementById("activeLicenses").textContent =
              data.active_licenses;
            document.getElementById("expiredLicenses").textContent =
              data.expired_licenses;
            document.getElementById("enterpriseLicenses").textContent =
              data.by_tier.enterprise || 0;
          })
          .catch((err) => console.error("Stats error:", err));
      }

      function loadLicenses() {
        fetch(`${API_URL}/api/licenses`, {
          headers: { Authorization: `Bearer ${authToken}` },
        })
          .then((res) => res.json())
          .then((licenses) => {
            const tbody = document.getElementById("licensesTable");
            if (licenses.length === 0) {
              tbody.innerHTML =
                '<tr><td colspan="8" class="loading">لا توجد تراخيص</td></tr>';
              return;
            }

            tbody.innerHTML = licenses
              .map(
                (lic) => `
                    <tr>
                        <td>
                            <code style="background:#1a1a2e;padding:4px 8px;border-radius:4px">${lic.key}</code>
                            <button class="copy-btn" onclick="copyKey('${lic.key}')" title="نسخ">📋</button>
                        </td>
                        <td><span class="badge badge-${lic.tier}">${getTierName(lic.tier)}</span></td>
                        <td>${lic.customer_name || "-"}</td>
                        <td><span class="badge badge-${lic.is_active ? "active" : "inactive"}">${lic.is_active ? "نشط" : "معطل"}</span></td>
                        <td>${lic.current_activations}/${lic.max_activations}</td>
                        <td>${formatDate(lic.created_at)}</td>
                        <td>${lic.expires_at ? formatDate(lic.expires_at) : "غير محدد"}</td>
                        <td class="actions">
                            ${lic.whatsapp ? `<button class="action-btn whatsapp-btn" onclick="openWhatsApp('${lic.whatsapp}', '${lic.key}')">📱</button>` : ""}
                            <button class="action-btn edit" onclick="toggleLicense('${lic.id}', ${!lic.is_active})">${lic.is_active ? "⏸️" : "▶️"}</button>
                            <button class="action-btn delete" onclick="deleteLicense('${lic.id}')">🗑️</button>
                        </td>
                    </tr>
                `,
              )
              .join("");
          })
          .catch((err) => {
            console.error("Licenses error:", err);
            document.getElementById("licensesTable").innerHTML =
              '<tr><td colspan="8" class="loading">خطأ في التحميل</td></tr>';
          });
      }

      // Create license
      function openCreateModal() {
        document.getElementById("createModal").classList.add("active");
      }

      function closeModal(id) {
        document.getElementById(id).classList.remove("active");
      }

      function createLicense(e) {
        e.preventDefault();

        const data = {
          tier: document.getElementById("newTier").value,
          customer_name: document.getElementById("newCustomerName").value,
          email: document.getElementById("newEmail").value,
          whatsapp: document.getElementById("newWhatsapp").value,
          days_valid: parseInt(document.getElementById("newDays").value),
          max_activations: parseInt(
            document.getElementById("newMaxActivations").value,
          ),
          notes: document.getElementById("newNotes").value,
        };

        fetch(`${API_URL}/api/licenses`, {
          method: "POST",
          headers: {
            Authorization: `Bearer ${authToken}`,
            "Content-Type": "application/json",
          },
          body: JSON.stringify(data),
        })
          .then((res) => res.json())
          .then((lic) => {
            closeModal("createModal");
            loadData();
            showToast(`تم إنشاء الترخيص: ${lic.key}`, "success");

            // Clear form
            document.getElementById("newCustomerName").value = "";
            document.getElementById("newEmail").value = "";
            document.getElementById("newWhatsapp").value = "";
            document.getElementById("newNotes").value = "";
          })
          .catch((err) => {
            showToast("خطأ في إنشاء الترخيص", "error");
          });
      }

      // Actions
      function toggleLicense(id, activate) {
        fetch(`${API_URL}/api/licenses/${id}`, {
          method: "PUT",
          headers: {
            Authorization: `Bearer ${authToken}`,
            "Content-Type": "application/json",
          },
          body: JSON.stringify({ is_active: activate }),
        }).then(() => {
          loadData();
          showToast(
            activate ? "تم تفعيل الترخيص" : "تم تعطيل الترخيص",
            "success",
          );
        });
      }

      function deleteLicense(id) {
        if (!confirm("هل أنت متأكد من حذف هذا الترخيص؟")) return;

        fetch(`${API_URL}/api/licenses/${id}`, {
          method: "DELETE",
          headers: { Authorization: `Bearer ${authToken}` },
        }).then(() => {
          loadData();
          showToast("تم حذف الترخيص", "success");
        });
      }

      function copyKey(key) {
        navigator.clipboard.writeText(key);
        showToast("تم نسخ المفتاح", "success");
      }

      function openWhatsApp(number, key) {
        const msg = encodeURIComponent(
          `مرحباً! 🎉\n\nترخيصك جاهز:\n${key}\n\nشكراً لاختيارك Harmulizer Pro!`,
        );
        window.open(
          `https://wa.me/${number.replace(/[^0-9]/g, "")}?text=${msg}`,
          "_blank",
        );
      }

      // Helpers
      function getTierName(tier) {
        const names = {
          free: "مجاني",
          basic: "أساسي",
          pro: "احترافي",
          enterprise: "مؤسسي",
        };
        return names[tier] || tier;
      }

      function formatDate(dateStr) {
        const d = new Date(dateStr);
        return d.toLocaleDateString("ar-EG", {
          year: "numeric",
          month: "short",
          day: "numeric",
        });
      }

      function showToast(msg, type = "success") {
        const toast = document.getElementById("toast");
        toast.textContent = msg;
        toast.className = `toast ${type} show`;
        setTimeout(() => toast.classList.remove("show"), 3000);
      }

      // Init
      document.addEventListener("DOMContentLoaded", () => {
        const saved = localStorage.getItem("adminToken");
        if (saved) {
          authToken = saved;
          document.getElementById("adminToken").value = saved;
          login();
        }
      });
    </script>
  </body>
</html>
